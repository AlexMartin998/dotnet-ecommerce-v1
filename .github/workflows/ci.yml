# CI: build + tests en cada push y cada PR.
#
# Hasta ahora nada obligaba a que los 153 tests estuvieran en verde antes de un merge:
# la red estaba tendida, pero solo si alguien se acordaba de correrla.
#
# ⚠️ Los tests de integracion necesitan SQL Server y Redis DE VERDAD. Aqui se levantan
# como `services` del runner en vez de con Testcontainers: es mas simple, no necesita
# Docker-in-Docker y usa exactamente el mismo camino de codigo que en local (el
# ApiFactory lee TEST_SQL_HOST / TEST_REDIS del entorno). Migrar a Testcontainers sigue
# siendo una opcion valida y aqui SI seria posible, porque el runner tiene Docker.

name: CI

# Permisos minimos explicitos: por defecto el GITHUB_TOKEN hereda los del repo, que
# suelen ser mas de los que un build necesita.
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene sentido
# esperar a un commit que ya esta obsoleto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Contraseña efimera, solo viva durante el job. No es un secreto del repo.
          MSSQL_SA_PASSWORD: "CiPassw0rd!2026"
        ports:
          - 1433:1433
        # ⚠️ La imagen `mssql` NO trae healthcheck propio y tarda ~20 s en aceptar
        # conexiones. Sin esto, el primer test falla por "connection refused" y parece
        # un fallo del codigo.
        # Con respaldo a la ruta antigua: si `mssql-tools18` no estuviera en la imagen, el
        # healthcheck no pasaria nunca a healthy y el job se colgaria hasta agotar los
        # reintentos -sin fallar por los tests, que es el peor modo de fallo en CI-.
        # OJO: estos comentarios van FUERA de `options`. Dentro de un escalar plegado
        # (`>-`) una linea que empieza por `#` NO es un comentario: es contenido, y acaba
        # pasada como argumentos a `docker create`, que no arranca el servicio.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiPassw0rd!2026' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'CiPassw0rd!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          # LOS DOS, y cada uno por un motivo distinto:
          #   10.0.x -> es el SDK que fija global.json, y el que hay en el entorno de
          #             trabajo. Compilar aqui y alli con el MISMO SDK es lo que hace que
          #             "cero warnings" signifique lo mismo en los dos sitios; antes se
          #             medía con analizadores distintos y la CI podia fallar por algo que
          #             en local no salia, o peor, al reves.
          #   9.0.x  -> el proyecto es net9.0 y el SDK 10 NO trae el runtime 9. Sin esto
          #             compila pero `dotnet test` no puede EJECUTAR los tests.
          dotnet-version: |
            9.0.x
            10.0.x

      # Cachear ~/.nuget baja el restore de ~40 s a unos pocos. La clave incluye el hash
      # de los .csproj: si cambian las dependencias, se invalida sola.
      - name: Cachear paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # ⚠️ NO `**/*.csproj`: eso incluye AGENTS/__ref__/01/code/ApiEcommerce.csproj, que
          # es el codigo del curso y ni siquiera se compila. Tocarlo invalidaria la cache.
          key: nuget-${{ runner.os }}-${{ hashFiles('ApiEcommerce.csproj', 'tests/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore ApiEcommerce.sln

      # ⚠️ -warnaserror: la regla del repo es "build limpio, 0 warnings". Si no falla el
      # pipeline, esa regla dura exactamente hasta el primer warning que nadie mire.
      - name: Compilar
        run: dotnet build ApiEcommerce.sln --configuration Release --no-restore -warnaserror

      - name: Tests
        env:
          TEST_SQL_HOST: localhost
          TEST_SQL_PORT: "1433"          # puerto INTERNO del service, no el 1434 de local
          TEST_SQL_PASSWORD: "CiPassw0rd!2026"
          TEST_REDIS: localhost:6379
          TEST_REDIS_DOWN: localhost:6398   # puerto muerto, para los tests de degradacion
        run: >-
          dotnet test ApiEcommerce.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      # Sin esto, un fallo en CI obliga a reproducirlo en local para ver que fallo.
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  # El Dockerfile nunca se ha construido (no hay Docker en el entorno de trabajo del
  # autor). Aqui si se puede: se construye para comprobar que sigue siendo valido, sin
  # publicar nada a ningun registro.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: apiecommerce:ci
