# =============================================================================
# FRAGMENTO para el docker-compose central (~/Documents/code/000_infra).
#
# NO es un compose completo y no pretende serlo (`AGENTS/rules.md` §13): la
# infraestructura compartida vive en ESE compose, no aquí. Este repo solo aporta
# los bloques que hay que PEGAR allí.
#
# Estado de ese compose a 2026-09-05, comprobado contra el fichero real:
#   sqlserver_ecommerce  -> ✅ existe, puerto 1434, healthcheck OK
#   redis_generic        -> ✅ existe, puerto 6999, healthcheck OK
#   rabbitmq_generic     -> ❌ FALTA. Es lo único que hay que añadir.
#
# Mientras falte, la API arranca igual y los eventos se acumulan en la tabla
# `OutboxMessages`: es el diseño (degradar en abierto, `rules.md` §8), no un fallo.
#
# La API en contenedor NO va aquí: vive en `docker-compose.prod.yml`, en la raíz
# de este repo, y se engancha a la red `backend` de este compose como externa.
# =============================================================================

services:

  # ---- 1) Pegar en el bloque `services:` --------------------------------------
  rabbitmq_generic:
    image: rabbitmq:3.13-management
    container_name: rabbitmq_generic
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP: el que usa la app
      - "15672:15672"   # UI de gestión: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq_generic_data:/var/lib/rabbitmq
    healthcheck:
      # `check_running` mira el nodo; `check_port_connectivity`, que el puerto AMQP
      # acepte conexiones. Un `rabbitmq-diagnostics ping` a secas da OK antes de que
      # el listener AMQP esté escuchando, y entonces `service_healthy` miente.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s   # RabbitMQ tarda ~15-20s en arrancar; sin esto los primeros fallos cuentan
    networks:
      - backend


# ---- 2) Pegar en el bloque `volumes:` (al final del compose) -----------------
volumes:
  rabbitmq_generic_data:


# =============================================================================
# Después de pegarlo:
#
#   cd ~/Documents/code/000_infra
#   docker compose up -d rabbitmq_generic
#   docker compose ps rabbitmq_generic        # esperar a `healthy` (~30s)
#
# Desde el dev container NO hace falta tocar nada de configuración: la app ya
# apunta a `amqp://guest:guest@172.17.0.1:5672` en appsettings.Development.json —
# 172.17.0.1 es la gateway del bridge de Docker, o sea el host, igual que para
# SQL Server (1434) y Redis (6999).
#
# Verificación de que el camino del broker funciona de punta a punta (el ⚠️ del
# slice 09, que nunca se ha ejercitado):
#
#   1. Arrancar la API y hacer una compra: POST /api/v1/product/buy
#   2. La tabla OutboxMessages debe pasar de `ProcessedAt IS NULL` a procesado
#      en <= PublishIntervalSeconds (5s).
#   3. En http://localhost:15672 -> Queues: `apiecommerce.product-purchased`
#      debe mostrar el mensaje entregado y confirmado (ack), y la DLQ vacía.
# =============================================================================
